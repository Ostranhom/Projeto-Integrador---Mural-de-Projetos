# Sobe um MySQL local para desenvolvimento:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: portal-editais-mysql
    environment:
      MYSQL_DATABASE: portal_editais
      MYSQL_USER: editais
      MYSQL_PASSWORD: editais
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
