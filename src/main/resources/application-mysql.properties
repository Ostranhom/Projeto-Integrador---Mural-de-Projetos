# Perfil MySQL. Credenciais vêm de variáveis de ambiente (com valores padrão do docker-compose.yml).
# Nunca coloque a senha real do servidor neste arquivo / no Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portal_editais?serverTimezone=America/Recife}
spring.datasource.username=${DB_USER:editais}
spring.datasource.password=${DB_PASSWORD:editais}

# "update" é prático no início; quando o modelo estabilizar, trocar por migrações (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
