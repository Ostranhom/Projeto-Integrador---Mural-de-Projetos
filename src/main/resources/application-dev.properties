# Perfil de desenvolvimento: banco H2 em memória (apagado a cada reinício).
spring.datasource.url=jdbc:h2:mem:editais;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do banco: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:editais)
spring.h2.console.enabled=true
