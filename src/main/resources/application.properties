spring.application.name=fip-uepb

# Perfil padrão: "dev" (banco H2 em memória, não precisa instalar nada).
# Para usar MySQL: rode com --spring.profiles.active=mysql
spring.profiles.default=dev

spring.jpa.open-in-view=false
server.servlet.session.timeout=30m

# Domínios de e-mail aceitos no cadastro e o perfil de cada um (separe vários por vírgula).
