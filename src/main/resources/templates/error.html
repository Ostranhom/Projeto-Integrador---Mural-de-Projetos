<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Página mostrada pelo Spring Boot quando acontece um erro (404, 403, 500...) -->
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container-estreito">
    <div class="card" th:switch="${status}">
        <h1 th:text="${status}">Erro</h1>
        <p th:case="403">Você não tem permissão para fazer isso.</p>
        <p th:case="404">Página não encontrada.</p>
        <p th:case="*">Algo deu errado. Tente novamente em instantes.</p>
        <a th:href="@{/}" class="btn">Ir para o início</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
