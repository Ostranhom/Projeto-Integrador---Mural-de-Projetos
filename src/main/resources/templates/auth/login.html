<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container-estreito">
    <div class="card">
        <h1>Entrar</h1>

        <div th:if="${param.erro}" class="alerta alerta-erro">E-mail ou senha inválidos.</div>
        <div th:if="${param.saiu}" class="alerta alerta-info">Você saiu da sua conta.</div>
        <div th:if="${param.cadastrado}" class="alerta alerta-sucesso">Conta criada! Faça login para continuar.</div>

        <!-- O POST para /login é processado pelo Spring Security -->
        <form th:action="@{/login}" method="post" class="form">
            <label for="email">E-mail institucional</label>
            <input type="email" id="email" name="email" required autofocus autocomplete="username"
                   placeholder="voce@aluno.uepb.edu.br">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required autocomplete="current-password">

            <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="texto-secundario">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
