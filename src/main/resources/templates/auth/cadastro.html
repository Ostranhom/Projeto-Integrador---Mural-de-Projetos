<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container-estreito">
    <div class="card">
        <h1>Criar conta</h1>
        <p class="texto-secundario">
            Use seu e-mail institucional. Alunos: <strong>@aluno.uepb.edu.br</strong> —
            Professores: <strong>@servidor.uepb.edu.br</strong>.
        </p>

        <form th:action="@{/cadastro}" th:object="${form}" method="post" class="form" novalidate>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" th:field="*{nome}" th:errorclass="invalido" autocomplete="name">
            <p class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>

            <label for="email">E-mail institucional</label>
            <input type="email" id="email" th:field="*{email}" th:errorclass="invalido" autocomplete="email">
            <p class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" th:errorclass="invalido" autocomplete="new-password">
            <p class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>

            <label for="confirmacaoSenha">Confirme a senha</label>
            <input type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}" th:errorclass="invalido"
                   autocomplete="new-password">
            <p class="erro-campo" th:if="${#fields.hasErrors('confirmacaoSenha')}" th:errors="*{confirmacaoSenha}"></p>

            <button type="submit" class="btn">Criar conta</button>
        </form>

        <p class="texto-secundario">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
